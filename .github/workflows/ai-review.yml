name: AI Pull Request Reviewer

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch: # Allows you to manually click a button to run it!

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run AI Reviewer
        uses: anc95/ChatGPT-Next-Web@main 
        env:
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # CRITICAL: Re-routes the OpenAI tool to use Google Gemini's endpoint
          OPENAI_API_BASE: "https://generativelanguage.googleapis.com/v1beta/openai/"
          # OPTIONAL: Force a highly-efficient Gemini model if the action supports it
          MODEL: "gemini-2.5-flash" 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

