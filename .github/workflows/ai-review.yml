name: AI Pull Request Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # Allows manual trigger button in UI

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Gives the bot access to comment on the PR

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run AI Reviewer
        uses: AleksandrFurmenkovOfficial/ai-code-review@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pr_number: ${{ github.event.pull_request.number }}
          
          # Built-in Google Gemini configuration
          ai_provider: "google"
          google_api_key: ${{ secrets.GEMINI_API_KEY }}
          google_model: "gemini-2.5-flash"
          
          # Optional tuning (keeps things relevant)
          exclude_paths: "package-lock.json,yarn.lock,dist/*,node_modules/*"

