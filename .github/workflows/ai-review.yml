name: AI Pull Request Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required so the bot can comment on the PR

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run AI Reviewer
        uses: anc95/ChatGPT-Next-Web@main # Replace with your preferred marketplace AI action
        env:
          OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub
