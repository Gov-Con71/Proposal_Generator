name: Deploy

# Runs on version tags (e.g. v1.0.0) or manual dispatch.
# Backend → build image and push to ECR (orchestration is managed separately).
# Frontend → deploy to Vercel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  backend-image:
    name: Backend — build & push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for OIDC role assumption
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }} # e.g. proposalai-backend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.ref_name }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -f backend/Dockerfile.prod -t "$IMAGE:$TAG" -t "$IMAGE:latest" backend
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG"

  frontend-vercel:
    name: Frontend — deploy to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proposalai-frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
