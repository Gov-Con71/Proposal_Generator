services:
  db:
    image: ankane/pgvector:latest
    container_name: rfp_postgres_db
    restart: always
    environment:
      POSTGRES_USER: brian_admin
      POSTGRES_PASSWORD: my_secure_password123
      POSTGRES_DB: rfp_proposal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z  # Added :Z for Podman SELinux permission handling
      - ./backend/init_scripts:/docker-entrypoint-initdb.d:Z
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: rfp_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  localstack:
    image: localstack/localstack:3
    container_name: rfp_localstack
    restart: always
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: fastapi_backend_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code:Z  # Added :Z for Podman volume mounting security layers
    environment:
      - DATABASE_URL=postgresql://brian_admin:my_secure_password123@db:5432/rfp_proposal_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - S3_BUCKET_NAME=proposal-artifacts-local
      - AWS_DEFAULT_REGION=us-east-1
      # Override in production — the app default is intentionally insecure.
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-change-me}
    depends_on:
      - db
      - redis
      - localstack
    networks:
      - app-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: rfp_celery_worker
    restart: always
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/code:Z
    environment:
      - DATABASE_URL=postgresql://brian_admin:my_secure_password123@db:5432/rfp_proposal_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - S3_BUCKET_NAME=proposal-artifacts-local
      - AWS_DEFAULT_REGION=us-east-1
      # GEMINI_API_KEY must be provided via the shell env or a .env file for extraction.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - db
      - redis
      - localstack
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
