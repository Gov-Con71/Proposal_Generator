# Full application stack: databases + FastAPI backend + Celery worker.
# Credentials/config come from the root .env (copy .env.example first):
#
#   cp .env.example .env   # then set GEMINI_API_KEY
#   docker compose up --build
#
# Note: service-to-service URLs use the compose network hostnames
# (db / redis / localstack), NOT the localhost values in .env.

services:
  db:
    image: ankane/pgvector:latest
    container_name: rfp_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z  # :Z for Podman SELinux handling
      - ./backend/init_scripts:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: rfp_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  localstack:
    image: localstack/localstack:3
    container_name: rfp_localstack
    restart: always
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: fastapi_backend_app
    # Without this the API is the one service that never comes back after a
    # crash or host reboot, while every dependency does — the failure then looks
    # like a broken app rather than a stopped container.
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code:Z  # :Z for Podman volume mounting security layers
    environment:
      # Internal URLs use compose hostnames, credentials from .env.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-proposal-artifacts-local}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - CACHE_URL=redis://redis:6379/2
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Override in production — the app default is intentionally insecure.
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - app-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: rfp_celery_worker
    restart: always
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/code:Z
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # The worker writes requirements straight to the DB, so it must evict what
      # the API cached on its behalf. Without this it silently falls back to
      # localhost, the cache is never invalidated, and a freshly ingested RFP
      # shows an empty workspace for a full TTL.
      - CACHE_URL=redis://redis:6379/2
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-proposal-artifacts-local}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # GEMINI_API_KEY must be provided via .env for extraction.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
