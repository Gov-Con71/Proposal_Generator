services:
  db:
    image: ankane/pgvector:latest
    container_name: rfp_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brian_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_secure_password123}
      POSTGRES_DB: ${POSTGRES_DB:-rfp_proposal_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./backend/init_scripts:/docker-entrypoint-initdb.d:Z
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-brian_admin} -d $${POSTGRES_DB:-rfp_proposal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: fastapi_backend_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code:Z
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-brian_admin}:${POSTGRES_PASSWORD:-my_secure_password123}@db:5432/${POSTGRES_DB:-rfp_proposal_db}
    depends_on:
      - db
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge