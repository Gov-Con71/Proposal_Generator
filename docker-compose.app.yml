# Full application stack: frontend + backend + worker + databases.
# One command brings up the entire app:
#
#   cp .env.example .env   # then set GEMINI_API_KEY
#   docker compose -f docker-compose.app.yml up --build
#
# Endpoints: frontend http://localhost:3000 · backend http://localhost:8000/docs
#
# Related files: docker-compose.yml = backend stack only (no frontend);
# docker-compose.db.yml = databases only. Config/secrets come from the root .env.

services:
  db:
    image: ankane/pgvector:latest
    container_name: rfp_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z  # :Z for Podman SELinux handling
      - ./backend/init_scripts:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: rfp_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  localstack:
    image: localstack/localstack:3
    container_name: rfp_localstack
    restart: always
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: fastapi_backend_app
    # Without this the API is the one service that never comes back after a
    # crash or host reboot, while every dependency does — the failure then looks
    # like a broken app rather than a stopped container.
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Rootless Podman maps container UID 0 to the host user by default, so the
    # bind-mounted source (host-owned) is only readable/executable — not
    # writable — to appuser (uid 1001, per Dockerfile.backend). keep-id remaps
    # the host user onto uid 1001 instead, giving appuser real ownership of
    # the mount. size=65536 keeps the full ID range mapped — omitting it
    # shrinks the map to just the remapped id and breaks the sysctl write
    # pasta needs for published ports ("ping_group_range ... Invalid
    # argument"). Ignored (harmless) under plain Docker.
    userns_mode: "keep-id:uid=1001,gid=1001,size=65536"
    volumes:
      # :z (shared, lowercase) — backend and celery-worker both bind-mount
      # this dir; a private :Z relabel from one locks the other out under SELinux.
      - ./backend:/code:z
    environment:
      # Runs `alembic upgrade head` in entrypoint.sh before uvicorn starts.
      # Only set here, not on celery-worker (same image/entrypoint) — two
      # processes racing on migrations at once is the thing to avoid.
      - RUN_MIGRATIONS=true
      # Internal URLs use compose hostnames, credentials from .env.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-proposal-artifacts-local}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - CACHE_URL=redis://redis:6379/2
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      # Optional cheaper/faster model for HyDE generation and compliance
      # extraction (see app/core/config.py). Empty (default) means no tiering.
      - LLM_MODEL_LIGHT=${LLM_MODEL_LIGHT:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      # Override in production — the app default is intentionally insecure.
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      # --- Logging (see app/core/logging.py) ---
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - LOG_REQUEST_HEADERS=${LOG_REQUEST_HEADERS:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
    # /health is a plain liveness check (no DB/Redis dependency of its own) —
    # enough to know entrypoint.sh's migration step finished and uvicorn is
    # actually serving. start_period covers migration time so a slow first
    # boot doesn't get marked unhealthy before it's had a chance. No curl in
    # this image, hence the python one-liner.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: python -m app.worker.dispatcher
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CACHE_URL=redis://redis:6379/2
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: rfp_celery_worker
    restart: always
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=2
    # See the backend service's userns_mode comment — same bind-mount fix applies here.
    userns_mode: "keep-id:uid=1001,gid=1001,size=65536"
    volumes:
      # :z (shared, lowercase) — backend and celery-worker both bind-mount
      # this dir; a private :Z relabel from one locks the other out under SELinux.
      - ./backend:/code:z
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # The worker writes requirements straight to the DB, so it must evict what
      # the API cached on its behalf. Without this it silently falls back to
      # localhost, the cache is never invalidated, and a freshly ingested RFP
      # shows an empty workspace for a full TTL.
      - CACHE_URL=redis://redis:6379/2
      - USE_LOCALSTACK=true
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-proposal-artifacts-local}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - LLM_MODEL_LIGHT=${LLM_MODEL_LIGHT:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      # GEMINI_API_KEY must be provided via .env for extraction/drafting.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - FEATHERLESS_API_KEY=${FEATHERLESS_API_KEY:-}
      # The worker had none of these: no ENVIRONMENT, no SENTRY_DSN, and no
      # logging configuration — so the two longest and most failure-prone paths
      # in the system (ingestion, drafting) reported their exceptions nowhere
      # and logged in a format nothing else used.
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_started
      # Backend's entrypoint runs `alembic upgrade head` before it reports
      # healthy — waiting on it here means the worker never picks up a task
      # against a not-yet-migrated schema on a fresh volume.
      backend:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./proposalai-frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it
        # has to be passed here, not as a runtime `environment` entry. The
        # browser calls the backend on the host port, so localhost:8000 is
        # correct for a local run; point this at the real API to deploy.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: proposalai_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_APP_NAME=ProposalAI
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
