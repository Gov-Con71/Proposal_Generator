# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent: env.py reads it from
# app.core.config.settings, which resolves DATABASE_URL. A checked-in copy of
# the URL is precisely how a migration ends up applied to the wrong database,
# and dev / CI / compose / production already each set DATABASE_URL.
#
#   alembic upgrade head      # apply everything outstanding
#   alembic stamp head        # adopt an already-provisioned database
#   alembic current           # what this database believes it is at

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
